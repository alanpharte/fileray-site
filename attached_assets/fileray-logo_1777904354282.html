<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fileray — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --plum:  #1c0f2e;
    --plum2: #251540;
    --lime:  #c9ff33;
    --white: #ffffff;
    --muted: #a08ec0;
    --faint: #3d2860;
  }

  body {
    background: var(--plum);
    font-family: 'Bricolage Grotesque', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding: 60px 40px;
  }

  /* ── SHOWCASE GRID ── */
  .showcase {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 28px;
    font-family: 'Bricolage Grotesque', sans-serif;
  }

  .block {
    padding: 64px 56px;
    border-radius: 0;
    position: relative;
  }

  .block-dark  { background: var(--plum); border: 1px solid rgba(255,255,255,0.07); border-radius: 20px 20px 0 0; border-bottom: none; }
  .block-dark2 { background: var(--plum2); border: 1px solid rgba(255,255,255,0.07); border-top: none; border-bottom: none; }
  .block-lime  { background: var(--lime); border: 1px solid rgba(0,0,0,0.08); border-top: none; border-bottom: none; }
  .block-white { background: #ffffff; border: 1px solid rgba(0,0,0,0.1); border-top: none; border-radius: 0 0 20px 20px; }

  /* ── LOGO SVG ── */
  .logo-svg { display: block; }

  /* ── MARK ONLY ROW ── */
  .marks-row {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .divider-line {
    height: 1px;
    background: rgba(255,255,255,0.07);
    margin: 0 56px;
  }

  /* ── SIZING GRID ── */
  .sizes-row {
    display: flex;
    align-items: center;
    gap: 48px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<div class="showcase">

  <!-- HERO: PRIMARY LOGO — dark bg -->
  <div class="block block-dark">
    <div class="label">Primary — dark</div>
    <svg class="logo-svg" width="520" height="90" viewBox="0 0 520 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="icon-clip-a">
          <rect width="90" height="90" rx="20"/>
        </clipPath>
      </defs>

      <!-- MARK -->
      <g clip-path="url(#icon-clip-a)">
        <!-- Background -->
        <rect width="90" height="90" fill="#c9ff33"/>
        <!-- F: vertical bar -->
        <rect x="18" y="15" width="15" height="60" rx="2" fill="#1c0f2e"/>
        <!-- F: top bar -->
        <rect x="18" y="15" width="50" height="15" rx="2" fill="#1c0f2e"/>
        <!-- F: mid bar -->
        <rect x="18" y="40" width="36" height="13" rx="2" fill="#1c0f2e"/>
        <!-- Rays: 3 lines fanning from right end of top bar -->
        <line x1="68" y1="22" x2="82" y2="6"  stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="22" x2="86" y2="22" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="22" x2="82" y2="38" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- WORDMARK with solid text shadow -->
      <!-- Shadow layer (dark navy, offset) -->
      <text x="122" y="72" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="68" fill="#0b0718" letter-spacing="-3">fileray</text>
      <!-- Main text (white, on top) -->
      <text x="116" y="66" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="68" fill="#ffffff" letter-spacing="-3">fileray</text>
    </svg>
  </div>

  <div class="divider-line"></div>

  <!-- ON DARK VARIANT 2 -->
  <div class="block block-dark2">
    <div class="label">Variant — deeper dark</div>
    <svg class="logo-svg" width="520" height="90" viewBox="0 0 520 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="icon-clip-b">
          <rect width="90" height="90" rx="20"/>
        </clipPath>
      </defs>
      <g clip-path="url(#icon-clip-b)">
        <rect width="90" height="90" fill="#c9ff33"/>
        <rect x="18" y="15" width="15" height="60" rx="2" fill="#251540"/>
        <rect x="18" y="15" width="50" height="15" rx="2" fill="#251540"/>
        <rect x="18" y="40" width="36" height="13" rx="2" fill="#251540"/>
        <line x1="68" y1="22" x2="82" y2="6"  stroke="#251540" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="22" x2="86" y2="22" stroke="#251540" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="22" x2="82" y2="38" stroke="#251540" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="122" y="72" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="68" fill="#130b28" letter-spacing="-3">fileray</text>
      <text x="116" y="66" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="68" fill="#ffffff" letter-spacing="-3">fileray</text>
    </svg>
  </div>

  <div class="divider-line" style="background:rgba(0,0,0,0.08);"></div>

  <!-- ON LIME BG -->
  <div class="block block-lime">
    <div class="label" style="color: rgba(28,15,46,0.4);">On lime</div>
    <svg class="logo-svg" width="520" height="90" viewBox="0 0 520 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="icon-clip-c">
          <rect width="90" height="90" rx="20"/>
        </clipPath>
      </defs>
      <g clip-path="url(#icon-clip-c)">
        <rect width="90" height="90" fill="#1c0f2e"/>
        <rect x="18" y="15" width="15" height="60" rx="2" fill="#c9ff33"/>
        <rect x="18" y="15" width="50" height="15" rx="2" fill="#c9ff33"/>
        <rect x="18" y="40" width="36" height="13" rx="2" fill="#c9ff33"/>
        <line x1="68" y1="22" x2="82" y2="6"  stroke="#c9ff33" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="22" x2="86" y2="22" stroke="#c9ff33" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="22" x2="82" y2="38" stroke="#c9ff33" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- Shadow: darker lime offset -->
      <text x="122" y="72" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="68" fill="#8fb800" letter-spacing="-3">fileray</text>
      <!-- Main: plum -->
      <text x="116" y="66" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="68" fill="#1c0f2e" letter-spacing="-3">fileray</text>
    </svg>
  </div>

  <div class="divider-line" style="background:rgba(0,0,0,0.08);"></div>

  <!-- ON WHITE BG -->
  <div class="block block-white">
    <div class="label" style="color: #c8c4d4;">On white</div>
    <svg class="logo-svg" width="520" height="90" viewBox="0 0 520 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="icon-clip-d">
          <rect width="90" height="90" rx="20"/>
        </clipPath>
      </defs>
      <g clip-path="url(#icon-clip-d)">
        <rect width="90" height="90" fill="#c9ff33"/>
        <rect x="18" y="15" width="15" height="60" rx="2" fill="#1c0f2e"/>
        <rect x="18" y="15" width="50" height="15" rx="2" fill="#1c0f2e"/>
        <rect x="18" y="40" width="36" height="13" rx="2" fill="#1c0f2e"/>
        <line x1="68" y1="22" x2="82" y2="6"  stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="22" x2="86" y2="22" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="22" x2="82" y2="38" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- Shadow: lime offset -->
      <text x="122" y="72" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="68" fill="#c9ff33" letter-spacing="-3">fileray</text>
      <!-- Main: plum -->
      <text x="116" y="66" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="68" fill="#1c0f2e" letter-spacing="-3">fileray</text>
    </svg>
  </div>

  <!-- ICON MARK — standalone sizes -->
  <div style="height:48px;"></div>

  <div class="block block-dark" style="border-radius:20px;">
    <div class="label">Mark — standalone at scale</div>
    <div class="marks-row">

      <!-- Large mark -->
      <svg width="96" height="96" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><clipPath id="mk-l"><rect width="90" height="90" rx="20"/></clipPath></defs>
        <g clip-path="url(#mk-l)">
          <rect width="90" height="90" fill="#c9ff33"/>
          <rect x="18" y="15" width="15" height="60" rx="2" fill="#1c0f2e"/>
          <rect x="18" y="15" width="50" height="15" rx="2" fill="#1c0f2e"/>
          <rect x="18" y="40" width="36" height="13" rx="2" fill="#1c0f2e"/>
          <line x1="68" y1="22" x2="82" y2="6"  stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
          <line x1="68" y1="22" x2="86" y2="22" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
          <line x1="68" y1="22" x2="82" y2="38" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>

      <!-- Medium mark -->
      <svg width="64" height="64" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><clipPath id="mk-m"><rect width="90" height="90" rx="20"/></clipPath></defs>
        <g clip-path="url(#mk-m)">
          <rect width="90" height="90" fill="#c9ff33"/>
          <rect x="18" y="15" width="15" height="60" rx="2" fill="#1c0f2e"/>
          <rect x="18" y="15" width="50" height="15" rx="2" fill="#1c0f2e"/>
          <rect x="18" y="40" width="36" height="13" rx="2" fill="#1c0f2e"/>
          <line x1="68" y1="22" x2="82" y2="6"  stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
          <line x1="68" y1="22" x2="86" y2="22" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
          <line x1="68" y1="22" x2="82" y2="38" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>

      <!-- Small mark -->
      <svg width="40" height="40" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><clipPath id="mk-s"><rect width="90" height="90" rx="20"/></clipPath></defs>
        <g clip-path="url(#mk-s)">
          <rect width="90" height="90" fill="#c9ff33"/>
          <rect x="18" y="15" width="15" height="60" rx="2" fill="#1c0f2e"/>
          <rect x="18" y="15" width="50" height="15" rx="2" fill="#1c0f2e"/>
          <rect x="18" y="40" width="36" height="13" rx="2" fill="#1c0f2e"/>
          <line x1="68" y1="22" x2="82" y2="6"  stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
          <line x1="68" y1="22" x2="86" y2="22" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
          <line x1="68" y1="22" x2="82" y2="38" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>

      <!-- Favicon size -->
      <svg width="24" height="24" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><clipPath id="mk-f"><rect width="90" height="90" rx="20"/></clipPath></defs>
        <g clip-path="url(#mk-f)">
          <rect width="90" height="90" fill="#c9ff33"/>
          <rect x="18" y="15" width="15" height="60" rx="2" fill="#1c0f2e"/>
          <rect x="18" y="15" width="50" height="15" rx="2" fill="#1c0f2e"/>
          <rect x="18" y="40" width="36" height="13" rx="2" fill="#1c0f2e"/>
          <line x1="68" y1="22" x2="82" y2="6"  stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
          <line x1="68" y1="22" x2="86" y2="22" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
          <line x1="68" y1="22" x2="82" y2="38" stroke="#1c0f2e" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>

      <!-- Labels -->
      <div style="margin-left:8px;">
        <div style="font-size:11px;color:var(--muted);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;line-height:2.8;">96px</div>
        <div style="font-size:11px;color:var(--muted);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;line-height:2.6;">64px</div>
        <div style="font-size:11px;color:var(--muted);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;line-height:3.2;">40px</div>
        <div style="font-size:11px;color:var(--muted);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;line-height:2.8;">24px</div>
      </div>

    </div>

    <!-- Wordmark sizes -->
    <div style="margin-top:48px;">
      <div class="label" style="margin-bottom:32px;">Wordmark — scale</div>

      <div style="display:flex;flex-direction:column;gap:20px;">

        <!-- 48px -->
        <svg width="380" height="54" viewBox="0 0 380 54" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="5" y="46" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="48" fill="#c9ff33" letter-spacing="-2">fileray</text>
          <text x="0" y="42" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="48" fill="#ffffff" letter-spacing="-2">fileray</text>
        </svg>

        <!-- 32px -->
        <svg width="260" height="38" viewBox="0 0 260 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="4" y="32" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="32" fill="#c9ff33" letter-spacing="-1.5">fileray</text>
          <text x="0" y="28" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="32" fill="#ffffff" letter-spacing="-1.5">fileray</text>
        </svg>

        <!-- 20px — nav size -->
        <svg width="166" height="26" viewBox="0 0 166 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="3" y="21" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="20" fill="#c9ff33" letter-spacing="-0.8">fileray</text>
          <text x="0" y="18" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.8">fileray</text>
        </svg>

      </div>
    </div>

    <!-- Colour swatches -->
    <div style="margin-top:48px;">
      <div class="label" style="margin-bottom:20px;">Brand colours</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <div style="width:80px;">
          <div style="height:52px;background:#1c0f2e;border-radius:10px;border:1px solid rgba(255,255,255,0.1);margin-bottom:8px;"></div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Plum</div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;color:var(--faint);margin-top:1px;">#1c0f2e</div>
        </div>
        <div style="width:80px;">
          <div style="height:52px;background:#251540;border-radius:10px;border:1px solid rgba(255,255,255,0.1);margin-bottom:8px;"></div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Deep plum</div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;color:var(--faint);margin-top:1px;">#251540</div>
        </div>
        <div style="width:80px;">
          <div style="height:52px;background:#c9ff33;border-radius:10px;border:1px solid rgba(0,0,0,0.08);margin-bottom:8px;"></div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Lime</div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;color:var(--faint);margin-top:1px;">#c9ff33</div>
        </div>
        <div style="width:80px;">
          <div style="height:52px;background:#ffffff;border-radius:10px;border:1px solid rgba(255,255,255,0.12);margin-bottom:8px;"></div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">White</div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;color:var(--faint);margin-top:1px;">#ffffff</div>
        </div>
        <div style="width:80px;">
          <div style="height:52px;background:#a08ec0;border-radius:10px;border:1px solid rgba(255,255,255,0.1);margin-bottom:8px;"></div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Muted</div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:10px;color:var(--faint);margin-top:1px;">#a08ec0</div>
        </div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
